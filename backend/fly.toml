# Opas API — deploy from the backend/ folder:
#   cd backend && fly launch --copy-config --name opas-api
#   fly secrets set DATABASE_URL=... OPENROUTER_API_KEY=... OPENROUTER_MODEL=...
#   fly deploy

app = "opas-api"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
